<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fun Fact Finder</title>
<style>
  :root { --bg: #eef2ff; --ink: #1c1f3a; --muted: #5d6385; --line: #d6dbf5; --card: #fff; --indigo: #4c6ef5; --yellow: #fcc419; --green: #2b8a3e; --red: #e03131; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 780px; margin: 0 auto; padding: 26px 16px 56px; }
  h1 { font: 900 38px/1.05 system-ui, sans-serif; margin: 0; } h1 span { background: var(--yellow); padding: 0 8px; border-radius: 8px; } .sub { color: var(--muted); margin: 8px 0; }
  #status { font-size: 13px; color: var(--muted); margin: 0 0 12px; } #status.ok { color: var(--green); } #status.err { color: var(--red); }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; } .tabs button { flex: 1; background: #fff; color: var(--ink); border: 2px solid var(--line); } .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; }
  input { font: inherit; padding: 11px 14px; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); min-width: 0; flex: 1 1 260px; font-size: 18px; }
  input:focus-visible, button:focus-visible { outline: 3px solid #91a7ff; outline-offset: 2px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; } .chips button { background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; font-size: 14px; font-weight: 600; } .chips button.on { background: var(--indigo); color: #fff; border-color: var(--indigo); }
  button { font: inherit; font-weight: 700; padding: 10px 18px; border: 0; border-radius: 12px; background: var(--indigo); color: #fff; cursor: pointer; }
  button.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); padding: 5px 11px; font-size: 13px; } button.busy { opacity: .55; cursor: progress; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; } .note { color: var(--muted); font-size: 14px; min-height: 20px; margin: 8px 0 0; }
  .fact { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-top: 10px; } .fact.top { border: 2px solid var(--indigo); }
  .fact .e { font-size: 34px; line-height: 1; } .fact p { margin: 0; font-size: 17px; flex: 1; } .fact small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
  .quiz { text-align: center; } .quiz .stmt { font: 700 22px/1.45 Georgia, serif; margin: 12px 0 18px; } .tf { display: flex; gap: 12px; justify-content: center; } .tf button { min-width: 130px; font-size: 18px; }
  .tf button.t { background: var(--green); } .tf button.f { background: var(--red); } #qScore { font-weight: 800; color: var(--indigo); } #qResult { font-size: 17px; min-height: 26px; margin-top: 14px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Fun Fact <span>Finder</span></h1>
  <p class="sub">Ask a curious question and find amazing true facts. Browse by topic, or test yourself with true or false.</p>
  <p id="status">Checking fact search...</p>
  <div class="tabs" role="tablist"><button class="on" id="tabA" role="tab">🔎 Ask</button><button id="tabB" role="tab">📚 Browse</button><button id="tabQ" role="tab">❓ True or false</button></div>

  <section id="modeA">
    <div class="panel"><div class="row" style="margin-top:0"><input id="q" placeholder="e.g. which animal has the most hearts?" maxlength="200" autocomplete="off" aria-label="Your question"><button id="go">Find facts</button></div>
      <div class="chips" id="examples"></div><div class="row"><button class="ghost" id="random">🎲 Random fact</button></div><p class="note" id="note" aria-live="polite"></p><div id="results"></div></div>
  </section>
  <section id="modeB" class="hidden"><div class="panel"><div class="chips" id="cats"></div><div id="browse"></div></div></section>
  <section id="modeQ" class="hidden"><div class="panel quiz" aria-live="polite"><div id="qScore">Score: 0 / 0</div><div class="stmt" id="stmt"></div>
    <div class="tf"><button class="t" id="btnT">✅ True</button><button class="f" id="btnF">❌ False</button></div><div id="qResult"></div><div class="row" style="justify-content:center"><button class="ghost" id="qNext">Next →</button></div></div></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const EXAMPLES = ["which animal has the most hearts?", "how long does sunlight take to reach us?", "what's the biggest desert?", "is a banana a berry?", "how many bones do we have?", "what's the fastest land animal?"];
let facts = [], busy = false, pending = false, qi = null, qTrue = true, answered = false, score = 0, asked = 0, ai = { ready: false, message: "Loading...", percent: null, error: null };
EXAMPLES.forEach((e) => { const b = document.createElement("button"); b.textContent = e; b.addEventListener("click", () => { $("q").value = e; find(); }); $("examples").append(b); });
function tab(m) { ["A", "B", "Q"].forEach((k) => { $("tab" + k).classList.toggle("on", k === m); $("mode" + k).classList.toggle("hidden", k !== m); }); if (m === "B" && !$("browse").children.length) browse("All"); if (m === "Q" && qi == null) quiz(); }
["A", "B", "Q"].forEach((k) => $("tab" + k).addEventListener("click", () => tab(k)));

function factEl(i, top) { const f = facts[i], d = document.createElement("div"); d.className = "fact" + (top ? " top" : ""); const e = document.createElement("span"); e.className = "e"; e.textContent = f.emoji; const p = document.createElement("p"); const sm = document.createElement("small"); sm.textContent = f.cat; p.append(sm, f.fact); d.append(e, p); return d; }
function show(idx, label) { $("note").textContent = label; const box = $("results"); box.innerHTML = ""; idx.forEach((i, k) => box.append(factEl(i, k === 0))); }
function keywordMatch(q) {
  const ws = q.toLowerCase().split(/[^a-z]+/).filter((w) => w.length > 3 && !["which", "what", "does", "have", "many", "much", "long", "take", "biggest", "there"].includes(w));
  return facts.map((f, i) => ({ i, s: ws.filter((w) => f.fact.toLowerCase().split(/[^a-z]+/).some((x) => x === w || x === w + "s" || w === x + "s" || (w.length > 4 && x.startsWith(w.slice(0, 5))))).length })).filter((x) => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 3).map((x) => x.i);
}
async function find() {
  if (busy) { pending = true; return; } const q = $("q").value.trim(); if (!q) { $("note").textContent = "Ask a question first, or tap an example."; return $("q").focus(); }
  if (!facts.length) { $("note").textContent = "The facts haven't loaded. Is the server running?"; return; }
  busy = true; $("go").classList.add("busy");
  try { if (!ai.ready) throw new Error("not ready"); const res = await fetch("/api/search", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ q }) }); const r = await res.json(); if (!res.ok) throw new Error(r.error); show(r, "Facts closest to your question:"); }
  catch { const k = keywordMatch(q); show(k, k.length ? (ai.ready ? "Keyword matches:" : "Keyword matches (the AI is still loading, smarter search soon):") : "No keyword matches yet." + (ai.ready ? "" : " Smarter search turns on when the AI is ready.")); }
  busy = false; $("go").classList.remove("busy"); if (pending) { pending = false; find(); }
}
$("go").addEventListener("click", find); $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") find(); });
$("random").addEventListener("click", () => { if (facts.length) show([Math.floor(Math.random() * facts.length)], "\ud83c\udfb2 Did you know?"); });
function browse(cat) {
  const cats = ["All", ...new Set(facts.map((f) => f.cat))], c = $("cats"); c.innerHTML = ""; cats.forEach((x) => { const b = document.createElement("button"); b.textContent = x; b.className = x === cat ? "on" : ""; b.addEventListener("click", () => browse(x)); c.append(b); });
  const box = $("browse"); box.innerHTML = ""; facts.forEach((f, i) => { if (cat === "All" || f.cat === cat) box.append(factEl(i, false)); });
}

// ---------- True or false (plain code): each fact has a matching myth ----------
function quiz() { if (!facts.length) { $("stmt").textContent = "Loading facts..."; return; } qi = Math.floor(Math.random() * facts.length); qTrue = Math.random() < 0.5; answered = false;
  $("stmt").textContent = qTrue ? facts[qi].fact : facts[qi].myth; $("qResult").textContent = ""; $("btnT").disabled = $("btnF").disabled = false; }
function answer(said) { if (answered || qi == null) return; answered = true; asked++; const right = said === qTrue; if (right) score++; $("btnT").disabled = $("btnF").disabled = true;
  $("qResult").textContent = (right ? "\ud83c\udf89 Correct! " : "\ud83d\ude05 Not quite. ") + (qTrue ? "That's true." : "That's false. The truth: " + facts[qi].fact); $("qScore").textContent = "Score: " + score + " / " + asked; $("qNext").focus(); }
$("btnT").addEventListener("click", () => answer(true)); $("btnF").addEventListener("click", () => answer(false)); $("qNext").addEventListener("click", quiz);

async function checkStatus() {
  try { ai = await (await fetch("/api/status")).json();
    if (ai.error) return setStatus("Search error: " + ai.error + ". Browse and the quiz still work.", "err");
    if (ai.ready) return setStatus("Fact search ready. It runs on your device.", "ok");
    setStatus(ai.message + (ai.percent != null ? " " + ai.percent + "%" : "") + " Browse and the quiz work meanwhile.");
  } catch { ai = { ready: false, error: "the server can't be reached" }; setStatus("Can't reach the server. Open http://localhost:3091 and make sure npm start is running.", "err"); return; }
  setTimeout(checkStatus, 1500);
}
function setStatus(t, c = "") { $("status").textContent = t; $("status").className = c; }
fetch("/api/facts").then((r) => r.json()).then((f) => (facts = f)).catch(() => ($("note").textContent = "Couldn't load the facts. Is the server running?"));
checkStatus();
</script>
</body>
</html>
